{o:"Entender o que é o MASP, para que serve, sua relação com o PDCA e a diferença entre problema agudo e crônico.",e:"O MASP (Metodologia de Análise e Solução de Problemas) é um método passo a passo para descobrir a causa raiz de um problema e garantir que ele nunca mais aconteça. Na linha de solda por resistência, serve para parar de enxugar gelo (consertar a mesma máquina ou retrabalhar a mesma peça todo dia) e resolver de vez solda fria, porca faltando ou eletrodo estragado. Ele é o PDCA detalhado em 8 passos: enquanto o PDCA é a roda da melhoria contínua, o MASP dá o caminho exato das ferramentas.",p:["P (Plan): etapas 1 a 4 (Identificar, Observar, Analisar, Plano de Ação).","D (Do): etapa 5 (Execução).","C (Check): etapa 6 (Verificação).","A (Act): etapas 7 e 8 (Padronização e Conclusão).","Problema agudo: apareceu do nada e parou a produção (ex.: tiristor queimado, 100 peças amassadas). Exige ação imediata.","Problema crônico: o velho conhecido que parece normal (ex.: eletrodo grudando toda sexta-feira). O MASP foca em matar este tipo de problema."]},
{o:"Priorizar qual defeito atacar primeiro usando dados reais de rejeição.",e:"Não dá para abraçar o mundo. O gráfico de Pareto mostra onde gastamos mais tempo e dinheiro, focando no “vital poucos” e ignorando o “trivial muitos”.",p:["Colete os dados de rejeição da soldagem por 1 semana.","Conte a quantidade de cada tipo de defeito (porca ausente, solda fria, respingo excessivo, desalinhamento).","Ordene do maior para o menor.","Calcule a porcentagem acumulada e foque no defeito que representa cerca de 80% dos problemas."],x:"Na prensa de solda de porcas M8, levantamos 100 defeitos no mês: 60 porcas faltando, 25 soldas fracas, 10 respingos severos e 5 desalinhamentos. O Pareto aponta direto para a porca faltando.",c:"Escolher o problema “porque o chefe acha”, em vez de olhar os números de rejeição.",r:["Use dados, não achismos","Ordene do maior para o menor defeito","Foque no topo do gráfico (regra 80/20)"]},
{o:"Ir ao chão de fábrica (Gemba) para descobrir onde, quando e quem sofre com o defeito.",e:"O problema não acontece na sala da engenharia, acontece na máquina. Ir ao Gemba é ver o processo rodando e estratificar os dados por turno, operador, lote de matéria-prima e máquina.",p:["Vá até a prensa de solda investigar no local.","Pergunte: o defeito ocorre mais no 1º ou no 2º turno?","Verifique se é em um lote específico de porcas ou chapas.","Analise se o problema ocorre em uma máquina específica (ex.: Máquina 03)."],x:"Ao estratificar a porca faltando, descobriu-se que 90% dos casos ocorrem no 2º turno, na Prensa 03, com o lote de porcas do novo fornecedor B (que veio com rebarba interna).",c:"Ficar na sala tomando café e tentar resolver o problema por palpite.",r:["Vá ao Gemba (chão de fábrica)","Estratifique por turno, operador, máquina e lote","Isole onde o problema realmente acontece"]},
{o:"Encontrar a causa raiz do defeito combinando o Diagrama de Ishikawa e os 5 Porquês.",e:"O Ishikawa abre a cabeça para os 6 fatores (Método, Máquina, Medida, Material, Mão de obra, Meio ambiente). Os 5 Porquês aprofundam a investigação até achar a origem técnica.",p:["Desenhe a espinha de peixe (Ishikawa) e liste hipóteses nos 6M.","Selecione a principal suspeita.","Faça a pergunta “por quê?” cinco vezes seguidas, até chegar na causa que não tem mais para onde correr."],x:"Ishikawa: Material (porca com rebarba) e Máquina (sensor de presença desregulado). 5 Porquês: 1) A porca faltou e a máquina bateu porque o sensor não detectou. 2) O sensor estava sujo de respingo. 3) Acumulou respingo porque a cortina de ar de limpeza estava desligada. 4) Estava desligada porque o registro quebrou na manutenção preventiva. 5) Não foi trocado porque não há item de checagem no checklist diário de TPM. Causa raiz: falha no item de checagem do setup/TPM diário.",c:"Parar no primeiro “por quê” ou culpar apenas o operador (“culpa da distração”).",r:["Use os 6M no Ishikawa","Pergunte “por quê?” até achar o processo ou a norma falha","Nunca culpe a pessoa, investigue o processo"]},
{o:"Montar um plano de ação claro, objetivo e sem ambiguidades para eliminar a causa raiz.",e:"Ideia boa sem dono e prazo é conversa fora. O 5W2H define O quê, Por quê, Quem, Onde, Quando, Como e Quanto custa.",p:["Pegue a causa raiz descoberta nos 5 Porquês.","Preencha as 7 colunas do 5W2H junto com a equipe de solda e manutenção.","Defina responsáveis com nome e sobrenome e prazos rígidos."],x:"O quê: atualizar o checklist diário de TPM incluindo o teste da cortina de ar do sensor de porcas. Por quê: evitar acúmulo de respingos e falha na detecção. Quem: Carlos (Liderança de Solda) e Roberto (Manutenção). Onde: Linha de Prensa de Solda 03. Quando: até 28/10/2026. Como: alterar o documento no sistema de engenharia e treinar os operadores no setup. Quanto: R$ 0,00 (apenas revisão de procedimento).",c:"Colocar prazos abertos (ex.: “assim que der”) ou o setor inteiro como responsável, em vez de uma pessoa específica.",r:["Use a ferramenta 5W2H","Nome e prazo fixo para cada ação","Foco na eliminação da causa raiz"]},
{o:"Colocar o plano 5W2H para rodar exatamente como combinado, sem desvios.",e:"Chegou a hora de tirar o plano do papel. A execução exige acompanhamento diário para garantir que as modificações físicas e documentais na máquina de solda aconteçam.",p:["Reúna a equipe envolvida e distribua as tarefas do 5W2H.","Monitore o andamento diariamente no quadro de gestão à vista do setor.","Se houver impedimento técnico (ex.: falta de peça de reposição), avise imediatamente a liderança."],x:"A manutenção trocou o bico da cortina de ar da Prensa 03 e a engenharia atualizou o formulário impresso de checklist de liberação de máquina que fica colado no painel.",c:"Deixar o plano guardado na gaveta após a reunião.",r:["Acompanhamento diário no quadro","Ação rápida em caso de desvios","Envolvimento direto dos operadores na mudança física"]},

{o:"Garantir que o processo modificado vire regra oficial, para que o erro não volte a ocorrer amanhã.",e:"Se funcionou, tem que virar padrão. Atualizamos a Instrução de Trabalho Padrão (ITP), o Plano de Controle da qualidade e treinamos todos os turnos.",p:["Altere o documento oficial (ITP) da operação de solda de porcas.","Atualize o Plano de Controle do processo com a nova frequência de checagem do sensor.","Faça a reciclagem com os operadores de todos os turnos."],x:"A ITP-SLD-015 foi revisada incluindo a verificação obrigatória da cortina de ar no setup de cada lote. O documento foi assinado pela Qualidade e disponibilizado no tablet da célula.",c:"Achar que “todo mundo já sabe” e não atualizar a documentação formal da fábrica.",r:["Atualize a Instrução de Trabalho (ITP)","Atualize o Plano de Controle","Treine todos os operadores e registre a presença"]},
{o:"Encerrar formalmente o projeto MASP, divulgar o aprendizado e comemorar o ganho de produtividade.",e:"Hora de registrar os ganhos financeiros e operacionais, agradecer o empenho da equipe de chão de fábrica e arquivar o relatório para consultas futuras.",p:["Monte o relatório final de uma página (One-Page MASP).","Apresente os resultados no DDS (Diálogo Diário de Segurança/Qualidade) para a fábrica inteira.","Encerre o registro no sistema da qualidade."],x:"O MASP da Prensa 03 foi fechado com economia estimada de 4 horas de retrabalho semanal e eliminação de reclamação de cliente montadora. O caso foi publicado no mural da qualidade da fábrica.",c:"Guardar o resultado na gaveta sem compartilhar o aprendizado com as outras linhas.",r:["Divulgue o resultado no DDS","Arquive o relatório padrão","Parabenize a equipe de chão de fábrica"]}

{ctx:"Uma longarina estrutural soldada a ponto com 5 porcas M8 foi enviada para a montadora automotiva e o cliente rejeitou o lote inteiro porque uma das porcas estava ausente.",id:"Além do MASP, usamos o IDEAL na resposta rápida ao cliente.<br>I (Identificar): o cliente reportou porca faltando na peça estrutural.<br>D (Definir): parar imediatamente o embarque do lote atual no armazém.<br>E (Explorar): verificar se o erro veio de falha de alimentação manual ou de falta de detecção.<br>A (Agir): inspecionar 100% das peças em estoque com calibrador passa/não-passa.<br>A (Avaliar): conferir se o cliente aceitou o lote retrabalhado com laudo de liberação.<br><b>IDEAL x MASP:</b> os dois seguem a lógica de identificar, entender, agir e avaliar. O IDEAL é ágil e organiza a contenção e a resposta ao cliente; o MASP vai fundo na causa raiz e padroniza para o erro não voltar.",par:"Porca ausente: 45 casos (75%) · Porca desalinhada: 10 casos (17%) · Queimadura de solda: 5 casos (8%) · Total: 60 casos.",ish:"Máquina: sensor indutivo desregulado na base · Método: falta de poka-yoke físico na gaveta de abastecimento · Material: espessura da arruela da porca fora de tolerância do lote · Mão de obra: operador novo sem treinamento na operação simultânea de dupla solda · Medida: ausência de checagem dimensional na liberação do lote · Meio ambiente: iluminação deficiente na mesa de montagem.",w:["Por que a porca faltou na peça enviada? Porque o operador soldou apenas 4 porcas em vez de 5.","Por que soldou 4? Porque o ciclo da máquina iniciou sem a 5ª porca estar no gabarito.","Por que a máquina iniciou sem a porca? Porque o pino sensor de presença estava com o cabo partido.","Por que o cabo partiu? Porque ficava esticado e raspava na movimentação da mesa.","Por que raspava? Porque não havia suporte guia fixador para o cabo flexível. Causa raiz: ausência de guia mecânico para proteção do chicote do sensor."],a:"O quê: instalar canaleta guia flexível de proteção para o chicote do senso {ctx:"A máquina de solda por projeção apresentava paradas constantes por desalinhamento do conjunto montado, gerando retrabalho de esmerilhamento e repasse.",par:"Motivos de parada de linha: Desalinhamento de projeção: 38 casos (63%) · Falha de acionamento pneumático: 15 casos (25%) · Erro de programação de tempo/corrente: 7 casos (12%) · Total: 60 casos.",ish:"Máquina: folga excessiva na guia do cabeçote superior da prensa · Método: sem procedimento de reaperto periódico dos parafusos guias · Material: variação dimensional no corte a laser da chapa fornecida internamente · Mão de obra: ajuste manual do gabarito feito “no olho” pelo operador · Medida: falta de calibrador pino na liberação inicial do turno · Meio ambiente: vibração excessiva de prensas vizinhas na mesma laje.",w:["Por que o conjunto saiu desalinhado? Porque o eletrodo superior bateu descentralizado na porca.","Por que bateu descentralizado? Porque o cabeçote superior apresentou folga lateral de 2 mm.","Por que apresentou folga? Porque os parafusos de fixação da bucha guia estavam frouxos.","Por que estavam frouxos? Porque sofrem vibração constante e não tinham arruela trava.","Por que não tinham arruela trava? Porque o projeto mecânico original não especificou componente antivibração (grower/Loctite). Causa raiz: falha de especificação do projeto original, sem elementos de travamento contra vibração."],a:"O quê: aplicar trava-rosca químico (Loctite 242) e arruelas grower em todos os parafusos guias das prensas de solda.<br>Por quê: impedir o afrouxamento por vibração operacional.<br>Quem: equipe de Manutenção Mecânica.<br>Onde: todas as 5 prensas de solda da célula.<br>Quando: 05/11/2026.<br>Como: desmontar, limpar as roscas, aplicar trava-rosca e dar o torque especificado no manual.<br>Quanto: R$ 120,00 (insumos).",r:"Antes: retrabalho = 14 horas por semana · desalinhamentos = 38 por mês.<br>Depois: retrabalho = 0 hora por semana · desalinhamentos = 0."}
